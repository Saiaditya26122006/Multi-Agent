<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpistemicOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        /* ============================================================
           EpistemicOS — Premium Chat Interface
           Font: Inter (body) + JetBrains Mono (stats/IDs)
           Palette: Paper-white + Sky Blue accent
           Layout: 56px collapsed sidebar + conversational chat
           ============================================================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-main: #FAFBFD;
            --bg-surface: #FFFFFF;
            --bg-sidebar: #FFFFFF;
            --border: #E8ECF0;
            --border-active: #0EA5E9;
            --accent: #0EA5E9;
            --accent-soft: rgba(14, 165, 233, 0.08);
            --accent-medium: rgba(14, 165, 233, 0.15);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-tertiary: #94A3B8;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
            --info: #0EA5E9;
            --sidebar-width-collapsed: 56px;
            --sidebar-width-expanded: 240px;
            --topbar-height: 48px;
            --input-height: 64px;
            --chat-max-width: 720px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --transition-fast: 150ms ease;
            --transition-normal: 200ms ease;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */

        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */

        .sidebar {
            width: var(--sidebar-width-collapsed);
            min-width: var(--sidebar-width-collapsed);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            transition: width var(--transition-normal), min-width var(--transition-normal);
            overflow: hidden;
            position: relative;
            z-index: 100;
        }

        .sidebar:hover {
            width: var(--sidebar-width-expanded);
            min-width: var(--sidebar-width-expanded);
        }

        .sidebar-logo {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            padding: 0 8px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            position: relative;
            white-space: nowrap;
            transition: background var(--transition-fast);
            border-left: 3px solid transparent;
            margin-left: -3px;
        }

        .sidebar-item:hover {
            background: var(--accent-soft);
        }

        .sidebar-item.active {
            border-left-color: var(--accent);
            background: var(--accent-soft);
        }

        .sidebar-item.active .sidebar-icon {
            color: var(--accent);
        }

        .sidebar-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: var(--text-secondary);
        }

        .sidebar-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .sidebar:hover .sidebar-label {
            opacity: 1;
        }

        .sidebar-badge {
            margin-left: auto;
            background: var(--accent-medium);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .sidebar:hover .sidebar-badge {
            opacity: 1;
        }

        .sidebar-health {
            margin-top: auto;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .health-ring {
            width: 32px;
            height: 32px;
            position: relative;
        }

        .health-ring svg {
            width: 32px;
            height: 32px;
            transform: rotate(-90deg);
        }

        .health-ring-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 3;
        }

        .health-ring-fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 82;
            stroke-dashoffset: 43;
            transition: stroke-dashoffset 0.5s ease;
        }

        .health-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-tertiary);
            opacity: 0;
            transition: opacity var(--transition-normal);
            white-space: nowrap;
        }

        .sidebar:hover .health-label {
            opacity: 1;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* TOP BAR */

        .topbar {
            height: var(--topbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-icon {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .topbar-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-medium);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
        }

        .topbar-pill .mono {
            font-size: 11px;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 8px;
        }

        /* MESSAGES AREA */

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .messages-container {
            max-width: var(--chat-max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* MESSAGE STYLES */

        .message {
            display: flex;
            gap: 12px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 600;
        }

        .message-system .message-avatar {
            background: var(--accent-medium);
            color: var(--accent);
        }

        .message-user .message-avatar {
            background: #E2E8F0;
            color: var(--text-secondary);
        }

        .message-body {
            max-width: 85%;
        }

        .message-user .message-body {
            text-align: right;
        }

        .message-bubble {
            display: inline-block;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
        }

        .message-user .message-bubble {
            background: #F1F5F9;
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message-system .message-bubble {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
        }

        .message-time {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        /* RICH CARDS */

        .rich-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-surface);
            box-shadow: var(--shadow-sm);
            margin-top: 8px;
        }

        .rich-card-header {
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rich-card-body {
            padding: 16px 18px;
        }

        .rich-card-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* PILL BUTTONS */

        .pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .pill-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .pill-btn:active {
            transform: scale(0.97);
        }

        .pill-btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .pill-btn-primary:hover {
            background: #0284C7;
            color: white;
        }

        /* DECISION BUTTONS */

        .decision-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .decision-btn {
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .decision-btn:active {
            transform: scale(0.97);
        }

        .decision-btn-yes {
            background: var(--success);
            color: white;
        }

        .decision-btn-adjust {
            background: var(--warning);
            color: white;
        }

        .decision-btn-kill {
            background: var(--danger);
            color: white;
        }

        /* EPISTEMIC BADGES */

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-confirmed { background: rgba(34,197,94,0.1); color: var(--success); }
        .badge-assumption { background: rgba(245,158,11,0.1); color: var(--warning); }
        .badge-contradiction { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-inferred { background: rgba(148,163,184,0.1); color: var(--text-tertiary); }

        /* HEATMAP */

        .heatmap-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .heatmap-label {
            font-size: 13px;
            color: var(--text-secondary);
            width: 140px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .heatmap-bar-container {
            flex: 1;
            height: 8px;
            background: #F1F5F9;
            border-radius: 4px;
            overflow: hidden;
        }

        .heatmap-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .heatmap-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            width: 36px;
            text-align: right;
            flex-shrink: 0;
        }

        /* FACT LIST */

        .fact-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .fact-item:last-child {
            border-bottom: none;
        }

        .fact-text {
            font-size: 14px;
            color: var(--text-primary);
            flex: 1;
        }

        /* TYPING INDICATOR */

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 8px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* ============================================================
           INPUT BAR
           ============================================================ */

        .input-area {
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            padding: 12px 24px;
            flex-shrink: 0;
        }

        .input-context {
            max-width: var(--chat-max-width);
            margin: 0 auto 8px;
            display: flex;
            gap: 6px;
        }

        .context-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid var(--accent-medium);
        }

        .input-bar {
            max-width: var(--chat-max-width);
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 12px;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .input-plus-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .input-plus-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .input-plus-btn:active {
            transform: scale(0.97);
        }

        .input-field {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            background: transparent;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .input-send-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .input-send-btn:hover {
            background: #0284C7;
        }

        .input-send-btn:active {
            transform: scale(0.97);
        }

        .input-send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* ============================================================
           PLUS TRAY
           ============================================================ */

        .tray-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-normal);
        }

        .tray-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .plus-tray {
            position: fixed;
            bottom: 0;
            left: var(--sidebar-width-collapsed);
            right: 0;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: var(--shadow-lg);
            z-index: 201;
            transform: translateY(100%);
            transition: transform var(--transition-normal) cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .plus-tray.active {
            transform: translateY(0);
        }

        .tray-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tray-tile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            border-left: 3px solid var(--border);
        }

        .tray-tile:hover {
            background: var(--accent-soft);
            border-color: var(--accent-medium);
            border-left-color: var(--accent);
        }

        .tray-tile:active {
            transform: scale(0.97);
        }

        .tray-tile-icon {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }

        .tray-tile-info {
            flex: 1;
            min-width: 0;
        }

        .tray-tile-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .tray-tile-badge {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-tertiary);
            margin-top: 2px;
        }

        .tray-tile-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tray-recommendation {
            max-width: 600px;
            margin: 16px auto 0;
            padding: 12px 16px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-medium);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tray-recommendation strong {
            color: var(--accent);
        }

        /* ============================================================
           TOAST
           ============================================================ */

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            animation: toastIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */

        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }

            .sidebar.mobile-open {
                display: flex;
                position: fixed;
                z-index: 300;
                width: var(--sidebar-width-expanded);
                min-width: var(--sidebar-width-expanded);
                box-shadow: var(--shadow-lg);
            }

            .sidebar.mobile-open .sidebar-label,
            .sidebar.mobile-open .sidebar-badge,
            .sidebar.mobile-open .health-label {
                opacity: 1;
            }

            .hamburger-btn {
                display: flex;
            }

            .plus-tray {
                left: 0;
            }
        }

        @media (max-width: 768px) {
            .topbar-pill {
                display: none;
            }

            .tray-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .messages-area {
                padding: 16px;
            }

            .input-area {
                padding: 10px 16px;
            }

            .heatmap-label {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">EO</div>
            <nav class="sidebar-nav">
                <div class="sidebar-item" data-workspace="0">
                    <i data-lucide="zap" class="sidebar-icon"></i>
                    <span class="sidebar-label">Auto</span>
                    <span class="sidebar-badge">Live</span>
                </div>
                <div class="sidebar-item active" data-workspace="1">
                    <i data-lucide="rss" class="sidebar-icon"></i>
                    <span class="sidebar-label">Feed</span>
                    <span class="sidebar-badge">3</span>
                </div>
                <div class="sidebar-item" data-workspace="2">
                    <i data-lucide="hammer" class="sidebar-icon"></i>
                    <span class="sidebar-label">Build</span>
                    <span class="sidebar-badge">5</span>
                </div>
                <div class="sidebar-item" data-workspace="3">
                    <i data-lucide="search" class="sidebar-icon"></i>
                    <span class="sidebar-label">Inspect</span>
                    <span class="sidebar-badge">9</span>
                </div>
                <div class="sidebar-item" data-workspace="4">
                    <i data-lucide="shield" class="sidebar-icon"></i>
                    <span class="sidebar-label">Challenge</span>
                    <span class="sidebar-badge">2</span>
                </div>
                <div class="sidebar-item" data-workspace="5">
                    <i data-lucide="check-circle" class="sidebar-icon"></i>
                    <span class="sidebar-label">Validate</span>
                    <span class="sidebar-badge">--</span>
                </div>
                <div class="sidebar-item" data-workspace="6">
                    <i data-lucide="download" class="sidebar-icon"></i>
                    <span class="sidebar-label">Export</span>
                    <span class="sidebar-badge">--</span>
                </div>
            </nav>
            <div class="sidebar-health">
                <div class="health-ring">
                    <svg viewBox="0 0 32 32">
                        <circle class="health-ring-bg" cx="16" cy="16" r="13"></circle>
                        <circle class="health-ring-fill" cx="16" cy="16" r="13"></circle>
                    </svg>
                </div>
                <span class="health-label mono">47% coverage</span>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger-btn" id="hamburgerBtn">
                        <i data-lucide="menu" style="width:20px;height:20px;"></i>
                    </button>
                    <i data-lucide="rss" class="topbar-icon" id="topbarIcon"></i>
                    <span class="topbar-title" id="topbarTitle">Feed</span>
                </div>
                <div class="topbar-pill">
                    <span class="mono">47%</span>
                    <span>|</span>
                    <span>9 issues</span>
                </div>
            </header>

            <!-- MESSAGES -->
            <div class="messages-area" id="messagesArea">
                <div class="messages-container" id="messagesContainer">
                    <!-- Demo content injected by JS -->
                </div>
            </div>

            <!-- INPUT -->
            <div class="input-area">
                <div class="input-context" id="inputContext">
                    <span class="context-chip">
                        <i data-lucide="rss" style="width:12px;height:12px;"></i>
                        Feed
                    </span>
                </div>
                <div class="input-bar">
                    <button class="input-plus-btn" id="plusBtn">
                        <i data-lucide="plus" style="width:16px;height:16px;"></i>
                    </button>
                    <textarea class="input-field" id="inputField" placeholder="Message EpistemicOS..." rows="1"></textarea>
                    <button class="input-send-btn" id="sendBtn">
                        <i data-lucide="arrow-up" style="width:16px;height:16px;"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- PLUS TRAY -->
    <div class="tray-backdrop" id="trayBackdrop"></div>
    <div class="plus-tray" id="plusTray">
        <div class="tray-grid" id="trayGrid">
            <div class="tray-tile" data-workspace="1">
                <i data-lucide="rss" class="tray-tile-icon"></i>
                <div class="tray-tile-info">
                    <div class="tray-tile-name">Feed</div>
                    <div class="tray-tile-badge">3 updates</div>
                </div>
                <div class="tray-tile-status" style="background:var(--success)"></div>
            </div>
            <div class="tray-tile" data-workspace="2">
                <i data-lucide="hammer" class="tray-tile-icon"></i>
                <div class="tray-tile-info">
                    <div class="tray-tile-name">Build</div>
                    <div class="tray-tile-badge">5 sections</div>
                </div>
                <div class="tray-tile-status" style="background:var(--warning)"></div>
            </div>
            <div class="tray-tile" data-workspace="3">
                <i data-lucide="search" class="tray-tile-icon"></i>
                <div class="tray-tile-info">
                    <div class="tray-tile-name">Inspect</div>
                    <div class="tray-tile-badge">9 issues</div>
                </div>
                <div class="tray-tile-status" style="background:var(--danger)"></div>
            </div>
            <div class="tray-tile" data-workspace="4">
                <i data-lucide="shield" class="tray-tile-icon"></i>
                <div class="tray-tile-info">
                    <div class="tray-tile-name">Challenge</div>
                    <div class="tray-tile-badge">2 active</div>
                </div>
                <div class="tray-tile-status" style="background:var(--warning)"></div>
            </div>
            <div class="tray-tile" data-workspace="5">
                <i data-lucide="check-circle" class="tray-tile-icon"></i>
                <div class="tray-tile-info">
                    <div class="tray-tile-name">Validate</div>
                    <div class="tray-tile-badge">Ready</div>
                </div>
                <div class="tray-tile-status" style="background:var(--text-tertiary)"></div>
            </div>
            <div class="tray-tile" data-workspace="6">
                <i data-lucide="download" class="tray-tile-icon"></i>
                <div class="tray-tile-info">
                    <div class="tray-tile-name">Export</div>
                    <div class="tray-tile-badge">Ready</div>
                </div>
                <div class="tray-tile-status" style="background:var(--text-tertiary)"></div>
            </div>
        </div>
        <div class="tray-recommendation">
            <i data-lucide="sparkles" style="width:16px;height:16px;color:var(--accent);flex-shrink:0;"></i>
            <span><strong>Recommended:</strong> Your Opportunity section needs 3 assumptions validated. Try <strong>Inspect</strong>.</span>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        // EpistemicOS — Chat Interface Logic
        // ============================================================

        (function() {
            'use strict';

            // --- State ---
            let ws = null;
            let sessionKey = null;
            let token = null;
            let currentWorkspace = 'Feed';
            let currentWorkspaceNum = 1;

            // --- DOM Elements ---
            const messagesArea = document.getElementById('messagesArea');
            const messagesContainer = document.getElementById('messagesContainer');
            const inputField = document.getElementById('inputField');
            const sendBtn = document.getElementById('sendBtn');
            const plusBtn = document.getElementById('plusBtn');
            const plusTray = document.getElementById('plusTray');
            const trayBackdrop = document.getElementById('trayBackdrop');
            const trayGrid = document.getElementById('trayGrid');
            const topbarTitle = document.getElementById('topbarTitle');
            const topbarIcon = document.getElementById('topbarIcon');
            const inputContext = document.getElementById('inputContext');
            const sidebar = document.getElementById('sidebar');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const toastContainer = document.getElementById('toastContainer');

            // --- Initialize Lucide Icons ---
            document.addEventListener('DOMContentLoaded', () => {
                lucide.createIcons();
                loadDemoContent();
                initEventListeners();
                initConnection();
            });

            // --- Event Listeners ---
            function initEventListeners() {
                // Send message
                sendBtn.addEventListener('click', sendMessage);
                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });

                // Auto-resize textarea
                inputField.addEventListener('input', () => {
                    inputField.style.height = 'auto';
                    inputField.style.height = Math.min(inputField.scrollHeight, 120) + 'px';
                });

                // Plus tray
                plusBtn.addEventListener('click', openTray);
                trayBackdrop.addEventListener('click', closeTray);

                // Tray tiles
                trayGrid.addEventListener('click', (e) => {
                    const tile = e.target.closest('.tray-tile');
                    if (tile) {
                        const wsNum = tile.dataset.workspace;
                        switchWorkspace(parseInt(wsNum));
                        closeTray();
                    }
                });

                // Sidebar items
                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const wsNum = parseInt(item.dataset.workspace);
                        switchWorkspace(wsNum);
                    });
                });

                // Hamburger
                hamburgerBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('mobile-open');
                });

                // Click outside sidebar on mobile
                document.addEventListener('click', (e) => {
                    if (sidebar.classList.contains('mobile-open') &&
                        !sidebar.contains(e.target) &&
                        e.target !== hamburgerBtn) {
                        sidebar.classList.remove('mobile-open');
                    }
                });
            }

            // --- Connection ---
            function initConnection() {
                token = getTokenFromUrl();
                if (!token) return;

                fetchSessionKey().then(() => {
                    connectWebSocket();
                    fetchMenu();
                });
            }

            function getTokenFromUrl() {
                const params = new URLSearchParams(window.location.search);
                return params.get('token') || 'ceo-web-access-2026';
            }

            async function fetchSessionKey() {
                if (!token) return;
                try {
                    const res = await fetch(`/api/session-key?token=${token}`);
                    if (res.ok) {
                        const data = await res.json();
                        sessionKey = data.session_key;
                    }
                } catch (err) {
                    console.error('Failed to fetch session key:', err);
                }
            }

            function connectWebSocket() {
                if (!sessionKey || !token) return;

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws/${sessionKey}?token=${token}`;

                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    showToast('Connected', 'info');
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleWsMessage(data);
                    } catch (err) {
                        console.error('WS parse error:', err);
                    }
                };

                ws.onclose = () => {
                    showToast('Disconnected. Reconnecting...', 'warning');
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = (err) => {
                    console.error('WS error:', err);
                };
            }

            function handleWsMessage(data) {
                if (data.role === 'user') {
                    return;
                } else if (data.role === 'status') {
                    if (data.text) {
                        showTypingIndicator();
                    } else {
                        removeTypingIndicator();
                    }
                } else if (data.role === 'assistant') {
                    removeTypingIndicator();
                    if (data.workspace_action === 'show_menu') {
                        appendSystemMessage(data.text, { rich_type: 'menu', menu_data: data.menu_data });
                    } else if (data.workspace_action === 'switch_workspace') {
                        switchWorkspace(data.workspace, false);
                        appendSystemMessage(data.text, { rich_type: 'workspace_intro', workspace: data.workspace });
                    } else {
                        appendSystemMessage(data.text, data.metadata || null);
                    }
                }
            }

            // --- Messages ---
            async function sendMessage() {
                const text = inputField.value.trim();
                if (!text) return;

                appendUserMessage(text);
                inputField.value = '';
                inputField.style.height = 'auto';

                if (token) {
                    try {
                        await fetch('/api/messages', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text, token })
                        });
                    } catch (err) {
                        console.error('Send error:', err);
                        showToast('Failed to send message', 'error');
                    }
                }
            }

            function appendUserMessage(text) {
                const html = `
                    <div class="message message-user">
                        <div class="message-avatar">A</div>
                        <div class="message-body">
                            <div class="message-bubble">${escapeHtml(text)}</div>
                            <div class="message-time">${formatTime(new Date())}</div>
                        </div>
                    </div>
                `;
                messagesContainer.insertAdjacentHTML('beforeend', html);
                scrollToBottom();
            }

            function appendSystemMessage(text, metadata) {
                removeTypingIndicator();
                let content = '';

                if (metadata && metadata.rich_type) {
                    metadata._text = text;
                    content = renderRichContent(metadata);
                } else {
                    content = `<div class="message-bubble">${formatMessageText(text)}</div>`;
                }

                const html = `
                    <div class="message message-system">
                        <div class="message-avatar">EO</div>
                        <div class="message-body">
                            ${content}
                            <div class="message-time">${formatTime(new Date())}</div>
                        </div>
                    </div>
                `;
                messagesContainer.insertAdjacentHTML('beforeend', html);
                lucide.createIcons();
                scrollToBottom();
                bindActionButtons();
            }

            function renderRichContent(metadata) {
                switch (metadata.rich_type) {
                    case 'workspace_intro': return renderWorkspaceIntro(metadata);
                    case 'heatmap': return renderHeatmap(metadata);
                    case 'fact_list': return renderFactList(metadata);
                    case 'decision': return renderDecision(metadata);
                    default: return `<div class="message-bubble">${metadata.text || ''}</div>`;
                }
            }

            function renderWorkspaceIntro(meta) {
                if (!meta.title && !meta.options) {
                    const wsName = meta.workspace || '';
                    const text = meta._text || '';
                    const header = wsName ? `<strong>Switched to ${escapeHtml(typeof wsName === 'string' ? wsName.charAt(0).toUpperCase() + wsName.slice(1) : wsName)}</strong>` : '';
                    return `<div class="message-bubble">${header}${text ? '<br><br>' + formatMessageText(text) : ''}</div>`;
                }

                const color = meta.color || 'var(--accent)';
                const options = (meta.options || []).map(o =>
                    `<button class="pill-btn action-btn" data-action="${escapeHtml(o)}">${escapeHtml(o)}</button>`
                ).join('');

                return `
                    <div class="rich-card">
                        <div class="rich-card-header" style="background:${color}">
                            <i data-lucide="${meta.icon || 'layout'}" style="width:16px;height:16px;"></i>
                            ${escapeHtml(meta.title || '')}
                        </div>
                        <div class="rich-card-body">
                            <p style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">${escapeHtml(meta.description || '')}</p>
                        </div>
                        <div class="rich-card-footer">${options}</div>
                    </div>
                `;
            }

            function renderHeatmap(meta) {
                const rows = (meta.sections || []).map(s => {
                    const pct = s.coverage || 0;
                    const color = pct >= 70 ? 'var(--success)' : pct >= 40 ? 'var(--warning)' : 'var(--danger)';
                    return `
                        <div class="heatmap-row">
                            <span class="heatmap-label">${escapeHtml(s.name)}</span>
                            <div class="heatmap-bar-container">
                                <div class="heatmap-bar" style="width:${pct}%;background:${color}"></div>
                            </div>
                            <span class="heatmap-value mono">${pct}%</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="rich-card">
                        <div class="rich-card-header" style="background:var(--accent)">
                            <i data-lucide="bar-chart-3" style="width:16px;height:16px;"></i>
                            Coverage Heatmap
                        </div>
                        <div class="rich-card-body">${rows}</div>
                    </div>
                `;
            }

            function renderFactList(meta) {
                const items = (meta.facts || []).map(f => {
                    const badgeClass = `badge-${(f.status || 'inferred').toLowerCase()}`;
                    return `
                        <div class="fact-item">
                            <span class="badge ${badgeClass}">${escapeHtml(f.status || 'INFERRED')}</span>
                            <span class="fact-text">${escapeHtml(f.text)}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="rich-card">
                        <div class="rich-card-body">${items}</div>
                    </div>
                `;
            }

            function renderDecision(meta) {
                return `
                    <div class="rich-card">
                        <div class="rich-card-body">
                            <p style="font-size:14px;color:var(--text-primary);margin-bottom:4px;font-weight:600;">${escapeHtml(meta.title || 'Decision Required')}</p>
                            <p style="font-size:14px;color:var(--text-secondary);">${escapeHtml(meta.description || '')}</p>
                            <div class="decision-buttons">
                                <button class="decision-btn decision-btn-yes action-btn" data-action="Yes">Yes</button>
                                <button class="decision-btn decision-btn-adjust action-btn" data-action="Adjust">Adjust</button>
                                <button class="decision-btn decision-btn-kill action-btn" data-action="Kill">Kill</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            function bindActionButtons() {
                document.querySelectorAll('.action-btn:not([data-bound])').forEach(btn => {
                    btn.setAttribute('data-bound', 'true');
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.action;
                        if (action) {
                            inputField.value = action;
                            sendMessage();
                        }
                    });
                });
            }

            // --- Typing Indicator ---
            function showTypingIndicator() {
                removeTypingIndicator();
                const html = `
                    <div class="message message-system" id="typingMsg">
                        <div class="message-avatar">EO</div>
                        <div class="message-body">
                            <div class="typing-indicator">
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                                <div class="typing-dot"></div>
                            </div>
                        </div>
                    </div>
                `;
                messagesContainer.insertAdjacentHTML('beforeend', html);
                scrollToBottom();
            }

            function removeTypingIndicator() {
                const el = document.getElementById('typingMsg');
                if (el) el.remove();
            }

            // --- Workspace ---
            function switchWorkspace(input, sendMsg = true) {
                const workspacesByNum = {
                    0: { id: 'auto', name: 'Auto', icon: 'zap' },
                    1: { id: 'feed', name: 'Feed', icon: 'rss' },
                    2: { id: 'build', name: 'Build', icon: 'hammer' },
                    3: { id: 'inspect', name: 'Inspect', icon: 'search' },
                    4: { id: 'challenge', name: 'Challenge', icon: 'shield' },
                    5: { id: 'validate', name: 'Validate', icon: 'check-circle' },
                    6: { id: 'export', name: 'Export', icon: 'download' }
                };
                const workspacesById = {};
                Object.values(workspacesByNum).forEach((w, i) => { workspacesById[w.id] = {...w, num: i}; });

                let ws_info;
                let num;
                if (typeof input === 'number') {
                    ws_info = workspacesByNum[input] || workspacesByNum[0];
                    num = input;
                } else if (typeof input === 'string' && workspacesById[input]) {
                    ws_info = workspacesById[input];
                    num = ws_info.num;
                } else {
                    ws_info = workspacesByNum[0];
                    num = 0;
                }

                currentWorkspace = ws_info.name;
                currentWorkspaceNum = num;

                document.querySelectorAll('.sidebar-item').forEach(item => {
                    item.classList.toggle('active', parseInt(item.dataset.workspace) === num);
                });

                topbarTitle.textContent = ws_info.name;
                topbarIcon.setAttribute('data-lucide', ws_info.icon);
                lucide.createIcons();

                inputContext.innerHTML = `
                    <span class="context-chip">
                        <i data-lucide="${ws_info.icon}" style="width:12px;height:12px;"></i>
                        ${ws_info.name}
                    </span>
                `;
                lucide.createIcons();

                if (sendMsg && token) {
                    const serverNum = num === 0 ? '7' : String(num);
                    fetch('/api/messages', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: serverNum, token })
                    }).catch(err => console.error('Workspace switch error:', err));
                }
            }

            // --- Plus Tray ---
            function openTray() {
                plusTray.classList.add('active');
                trayBackdrop.classList.add('active');
                fetchMenu();
            }

            function closeTray() {
                plusTray.classList.remove('active');
                trayBackdrop.classList.remove('active');
            }

            async function fetchMenu() {
                if (!token) return;
                try {
                    const res = await fetch(`/api/menu?token=${token}`);
                    if (res.ok) {
                        const data = await res.json();
                        // Update tray badges if data available
                    }
                } catch (err) {
                    // Silently fail - use static demo data
                }
            }

            // --- Toast ---
            function showToast(message, type = 'info') {
                const colors = {
                    info: 'var(--info)',
                    warning: 'var(--warning)',
                    error: 'var(--danger)',
                    success: 'var(--success)'
                };
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `
                    <div style="width:4px;height:24px;border-radius:2px;background:${colors[type] || colors.info};flex-shrink:0;"></div>
                    <span>${escapeHtml(message)}</span>
                `;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            // --- Utilities ---
            function scrollToBottom() {
                requestAnimationFrame(() => {
                    messagesArea.scrollTop = messagesArea.scrollHeight;
                });
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function formatMessageText(text) {
                return escapeHtml(text).replace(/\n/g, '<br>');
            }

            function formatTime(date) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            // --- Demo Content ---
            function loadDemoContent() {
                const demoMessages = [
                    {
                        type: 'system',
                        text: 'Welcome back, Alex. Your plan is at 47% coverage with 9 open issues. What would you like to work on?'
                    },
                    {
                        type: 'user',
                        text: 'Show me what needs attention'
                    },
                    {
                        type: 'system',
                        rich: true,
                        metadata: {
                            rich_type: 'workspace_intro',
                            title: 'Inspect Workspace',
                            icon: 'search',
                            color: '#0EA5E9',
                            description: 'Explore your plan\'s epistemic foundation. See what\'s confirmed, what\'s assumed, and where contradictions exist.',
                            options: ['Show all assumptions', 'Find contradictions', 'Coverage gaps', 'Recent changes']
                        }
                    },
                    {
                        type: 'system',
                        text: 'Here\'s your current coverage across plan sections:'
                    },
                    {
                        type: 'system',
                        rich: true,
                        metadata: {
                            rich_type: 'heatmap',
                            sections: [
                                { name: 'Opportunity', coverage: 72 },
                                { name: 'Market Size', coverage: 45 },
                                { name: 'Competitors', coverage: 38 },
                                { name: 'Revenue Model', coverage: 61 },
                                { name: 'Go-to-Market', coverage: 29 },
                                { name: 'Team', coverage: 85 },
                                { name: 'Financials', coverage: 22 }
                            ]
                        }
                    },
                    {
                        type: 'system',
                        text: 'Key facts from your Opportunity section:'
                    },
                    {
                        type: 'system',
                        rich: true,
                        metadata: {
                            rich_type: 'fact_list',
                            facts: [
                                { text: 'TAM estimated at $4.2B globally for epistemic tools', status: 'CONFIRMED' },
                                { text: 'Primary user segment: solo founders pre-Series A', status: 'ASSUMPTION' },
                                { text: 'Previous market sizing put TAM at $800M (2024 report)', status: 'CONTRADICTION' },
                                { text: 'Adjacent market in research tools growing 34% YoY', status: 'INFERRED' }
                            ]
                        }
                    },
                    {
                        type: 'user',
                        text: 'The $4.2B figure is correct - it includes all knowledge management SaaS'
                    },
                    {
                        type: 'system',
                        text: 'Got it. I\'ve marked the TAM figure as confirmed and flagged the 2024 report as superseded. The contradiction is resolved.\n\nWould you like me to proceed with validating the remaining assumptions in Opportunity, or switch focus to Go-to-Market which has the lowest coverage?'
                    }
                ];

                demoMessages.forEach(msg => {
                    if (msg.type === 'user') {
                        const html = `
                            <div class="message message-user">
                                <div class="message-avatar">A</div>
                                <div class="message-body">
                                    <div class="message-bubble">${escapeHtml(msg.text)}</div>
                                </div>
                            </div>
                        `;
                        messagesContainer.insertAdjacentHTML('beforeend', html);
                    } else if (msg.rich) {
                        let content = renderRichContent(msg.metadata);
                        const html = `
                            <div class="message message-system">
                                <div class="message-avatar">EO</div>
                                <div class="message-body">
                                    ${content}
                                </div>
                            </div>
                        `;
                        messagesContainer.insertAdjacentHTML('beforeend', html);
                    } else {
                        const html = `
                            <div class="message message-system">
                                <div class="message-avatar">EO</div>
                                <div class="message-body">
                                    <div class="message-bubble">${formatMessageText(msg.text)}</div>
                                </div>
                            </div>
                        `;
                        messagesContainer.insertAdjacentHTML('beforeend', html);
                    }
                });

                lucide.createIcons();
                bindActionButtons();
                scrollToBottom();
            }

        })();
    </script>
