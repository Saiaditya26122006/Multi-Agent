agents:
  mother_agent:
    jid_env: "MOTHER_AGENT_JID"
    password_env: "MOTHER_AGENT_PASSWORD"
    model: "claude-sonnet"
    model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: []
    role: "orchestrator"
    retry_limit: 3
    timeout_seconds: 120
    description: "Plans, orchestrates, validates, integrates memory, runs coherence audit"

  opportunity_analyst:
    jid_env: "OPPORTUNITY_ANALYST_JID"
    password_env: "OPPORTUNITY_ANALYST_PASSWORD"
    model: "claude-sonnet"
    model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: ["1"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Analyses business opportunity, competitive strategy, objectives, ICP"

  entrepreneur_team:
    jid_env: "ENTREPRENEUR_TEAM_JID"
    password_env: "ENTREPRENEUR_TEAM_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["2"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Assesses founding team credibility, identifies strengths and gaps"

  environment_research:
    jid_env: "ENVIRONMENT_RESEARCH_JID"
    password_env: "ENVIRONMENT_RESEARCH_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["3"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "PEST analysis, Porter five forces, risks and opportunities"

  organisation_designer:
    jid_env: "ORGANISATION_DESIGNER_JID"
    password_env: "ORGANISATION_DESIGNER_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["4"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Company structure, org chart, capability gaps, production flow"

  hr_plan:
    jid_env: "HR_PLAN_JID"
    password_env: "HR_PLAN_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["11"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Hiring timeline, roles, compensation strategy, headcount plan, knowledge gaps"

  swot_synthesizer:
    jid_env: "SWOT_SYNTHESIZER_JID"
    password_env: "SWOT_SYNTHESIZER_PASSWORD"
    model: "claude-sonnet"
    model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: ["5"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "SWOT matrix synthesis — runs only after sections 3 and 4 are both complete"

  alliances:
    jid_env: "ALLIANCES_JID"
    password_env: "ALLIANCES_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["7"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Partnership strategy, make-vs-buy decisions — partnership-heavy models only"

  marketing_strategy:
    jid_env: "MARKETING_STRATEGY_JID"
    password_env: "MARKETING_STRATEGY_PASSWORD"
    model: "claude-sonnet"
    model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: ["8"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 120
    description: "Full marketing plan — target market, pricing, channels, revenue, CAC, unit economics"

  quality_management:
    jid_env: "QUALITY_MANAGEMENT_JID"
    password_env: "QUALITY_MANAGEMENT_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["9"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Quality assurance approach, procedures, metrics — service businesses only"

  rd_technology:
    jid_env: "RD_TECHNOLOGY_JID"
    password_env: "RD_TECHNOLOGY_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["6"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "R&D plan, IP analysis, technology risk, development milestones — tech/IP businesses only"

  operations:
    jid_env: "OPERATIONS_JID"
    password_env: "OPERATIONS_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["10"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Production plan, operations, cost structure — conditional"

  financial_modelling:
    jid_env: "FINANCIAL_MODELLING_JID"
    password_env: "FINANCIAL_MODELLING_PASSWORD"
    model: "claude-sonnet"
    model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: ["12"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 180
    description: "Full financial plan with SimPy simulation — longest timeout due to 1000 runs"
    financial_skills:
      - "three_statement_model"
      - "dcf_model"
      - "comps_analysis"
    simpy_runs_env: "SIMPY_SIMULATION_RUNS"

  launch_contingency:
    jid_env: "LAUNCH_CONTINGENCY_JID"
    password_env: "LAUNCH_CONTINGENCY_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["13"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Start-up programme — launch timeline, prerequisites, capital plan"

  exit_strategy:
    jid_env: "EXIT_STRATEGY_JID"
    password_env: "EXIT_STRATEGY_PASSWORD"
    model: "claude-sonnet"
    model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: ["14"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 120
    description: "Exit strategy, cap table, investor returns, contingency triggers"

  summary_agent:
    jid_env: "SUMMARY_JID"
    password_env: "SUMMARY_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    sections_owned: ["executive_summary"]
    role: "child_agent"
    retry_limit: 3
    timeout_seconds: 90
    description: "Executive summary — runs last, reads all completed section outputs"

  council_agent:
    jid_env: "COUNCIL_AGENT_JID"
    password_env: "COUNCIL_AGENT_PASSWORD"
    model: "claude-haiku"
    model_env: "CLAUDE_HAIKU_MODEL"
    synthesizer_model_env: "CLAUDE_SONNET_MODEL"
    sections_owned: []
    role: "quality_gate"
    retry_limit: 1
    timeout_seconds: 60
    description: "5-persona deliberation gate — reviews SWOT, Financial, Marketing, Summary outputs before Mother accepts"
    gated_sections: ["5", "8", "12", "executive_summary"]

execution_groups:
  1:
    name: "Foundation"
    agents: ["opportunity_analyst", "entrepreneur_team", "organisation_designer"]
    parallel: true
    description: "Idea, opportunity, team, capabilities — low dependency, high context value"

  2:
    name: "Evidence building"
    agents: ["environment_research", "rd_technology", "marketing_strategy"]
    parallel: true
    depends_on_groups: [1]
    description: "Market, competition, external environment, technology assessment — needs Group 1 outputs"

  3:
    name: "Strategy synthesis"
    agents: ["swot_synthesizer", "alliances", "marketing_strategy", "quality_management", "operations", "hr_plan"]
    parallel: false
    depends_on_groups: [1, 2]
    description: "SWOT, alliances, GTM strategy, quality, operations, HR plan — high dependency"
    notes: "swot_synthesizer first, then alliances, then marketing_strategy, then quality_management, then operations, then hr_plan last"

  4:
    name: "Financial and close"
    agents: ["financial_modelling", "launch_contingency", "exit_strategy", "summary_agent"]
    parallel: false
    depends_on_groups: [1, 2, 3]
    description: "Financials, launch programme, exit strategy, executive summary — highest dependency"
    notes: "financial_modelling runs first, then launch_contingency, then exit_strategy, then summary_agent last"
